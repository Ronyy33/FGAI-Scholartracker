# Curriculum and grading configuration.
#
# PROVENANCE
# - Semester 5 is INFERRED from the reference CSV:
#     * subject codes, maximum marks and assessment schemes are read from its columns;
#     * credits were recovered by least squares: credit_weighted_marks_pct and
#       overall_attendance_pct are reproduced to within +/-0.06 using these credits
#       (see reports/data_quality_report.md).
#     * CIE max 40 / ETE max 60 for 100-mark theory subjects is inferred from the observed
#       maxima; it is not an official rule.
# - Semesters 1-4 and 6-8 are ILLUSTRATIVE and SYNTHETIC. They follow the same structure
#   so the synthetic generator can produce multi-semester histories. They are not your
#   college's real syllabus.
# - The grading rules below are ILLUSTRATIVE. Replace them with your college's official rules
#   if you have them; nothing else in the code needs to change.
#
# Assessment schemes
#   theory   : CIE (continuous internal evaluation) + ETE (end-term exam) = total
#   ete_only : ETE only; the CIE column, if present, must be 0 or empty
#   termwork : termwork only

version: 1

grading:
  # Subject is passed if total >= pass_total_pct % of max_marks AND, when the subject has an
  # ETE component, ETE >= pass_ete_pct % of the ETE maximum.
  pass_total_pct: 40
  pass_ete_pct: 40
  # Letter-grade points follow the common 10-point scale (O=10 ... P=4, F=0).
  # The percentage cut-offs are illustrative.
  grade_points:          # [minimum total %, grade points]; below the last row (or failed) -> 0
    - [90, 10]
    - [80, 9]
    - [70, 8]
    - [60, 7]
    - [55, 6]
    - [50, 5]
    - [40, 4]

