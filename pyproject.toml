[project]
name = "scholartrack"
version = "0.1.0"
description = "ScholarTrack: detecting students at risk of falling behind (MLP + LSTM)."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are added phase by phase as code that needs them is written.
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "torch>=2.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholartrack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # third-party notice from Starlette about its test client; not about our code
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
